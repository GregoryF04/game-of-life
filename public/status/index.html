<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Server Status</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
  <style>
    body { font-family: sans-serif; background: #111; color: #eee; padding: 20px; }
    .stats { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
    .card { background: #1a1a1a; padding: 15px 20px; border-radius: 8px; min-width: 150px; }
    .card h3 { margin: 0 0 5px; font-size: 0.85em; color: #888; }
    .card .value { font-size: 1.5em; font-weight: bold; }
    .charts { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 20px; }
    .chartContainer { flex: 1; min-width: 300px; background: #1a1a1a; padding: 15px; border-radius: 8px; }
    canvas { max-height: 250px; }
    .logBox { background: #1a1a1a; padding: 15px; border-radius: 8px; }
    .logBox h3 { margin-top: 0; color: #888; }
    pre { background: #000; padding: 10px; border-radius: 6px; overflow-x: auto; font-size: 0.8em; max-height: 300px; overflow-y: auto; }
  </style>
</head>
<body>
  <h1>Server Status</h1>
  <div class="stats" id="statsCards"></div>

  <div class="charts">
    <div class="chartContainer">
      <canvas id="memChart"></canvas>
    </div>
    <div class="chartContainer">
      <canvas id="cpuChart"></canvas>
    </div>
  </div>

  <div class="logBox">
    <h3>Docker Stats Log (last 30 entries)</h3>
    <pre id="dockerStatsLog">Loading...</pre>
  </div>

  <div class="logBox">
    <h3>Host Server Info</h3>
    <div class="stats" id="hostStatsCards"></div>
  </div>

  <script>
    const MAX_POINTS = 60;
    const memHistory = [];
    const cpuHistory = [];
    const timeLabels = [];

    const memCtx = document.getElementById('memChart').getContext('2d');
    const memChart = new Chart(memCtx, {
      type: 'line',
      data: {
        labels: timeLabels,
        datasets: [{ label: 'RSS Memory (MB)', data: memHistory, borderColor: '#00ff66', tension: 0.3 }],
      },
      options: {
        responsive: true,
        scales: { y: { beginAtZero: true, ticks: { color: '#888' } }, x: { ticks: { color: '#888' } } },
        plugins: { legend: { labels: { color: '#eee' } } },
      },
    });

    const cpuCtx = document.getElementById('cpuChart').getContext('2d');
    const cpuChart = new Chart(cpuCtx, {
      type: 'line',
      data: {
        labels: timeLabels,
        datasets: [{ label: 'CPU Usage (%)', data: cpuHistory, borderColor: '#ff9900', tension: 0.3 }],
      },
      options: {
        responsive: true,
        scales: { y: { beginAtZero: true, max: 100, ticks: { color: '#888' } }, x: { ticks: { color: '#888' } } },
        plugins: { legend: { labels: { color: '#eee' } } },
      },
    });

    async function pollHostStats() {
  const res = await fetch('/host-stats');
  const data = await res.json();

  if (data.error) {
    document.getElementById('hostStatsCards').innerHTML = `<div class="card"><h3>Error</h3><div class="value">${data.error}</div></div>`;
    return;
  }

  const memUsedPct = (100 - (data.memory.availableKB / data.memory.totalKB) * 100).toFixed(1);
  const swapUsedPct = data.swap.totalKB > 0
    ? (100 - (data.swap.freeKB / data.swap.totalKB) * 100).toFixed(1)
    : '0.0';
  const uptimeHours = (data.hostUptimeSeconds / 3600).toFixed(1);

  document.getElementById('hostStatsCards').innerHTML = `
    <div class="card"><h3>CPU Steal</h3><div class="value">${data.cpuStealPercent}%</div></div>
    <div class="card"><h3>Load Average</h3><div class="value">${data.loadAverage}</div></div>
    <div class="card"><h3>Host RAM Used</h3><div class="value">${memUsedPct}%</div></div>
    <div class="card"><h3>Swap Used</h3><div class="value">${swapUsedPct}%</div></div>
    <div class="card"><h3>Disk</h3><div class="value" style="font-size: 0.7em;">${data.disk}</div></div>
    <div class="card"><h3>Host Uptime</h3><div class="value">${uptimeHours}h</div></div>
  `;
}

pollHostStats();
setInterval(pollHostStats, 10000);

    async function pollHealth() {
      const res = await fetch('/health');
      const data = await res.json();

      const rssMB = (data.memory.rss / 1024 / 1024).toFixed(1);
      const now = new Date().toLocaleTimeString();

      memHistory.push(rssMB);
      cpuHistory.push(data.cpuPercent);
      timeLabels.push(now);
      if (memHistory.length > MAX_POINTS) {
        memHistory.shift();
        cpuHistory.shift();
        timeLabels.shift();
      }
      memChart.update();
      cpuChart.update();

      document.getElementById('statsCards').innerHTML = `
        <div class="card"><h3>Status</h3><div class="value">${data.status}</div></div>
        <div class="card"><h3>Uptime</h3><div class="value">${Math.floor(data.uptimeSeconds / 60)}m</div></div>
        <div class="card"><h3>RSS Memory</h3><div class="value">${rssMB} MB</div></div>
        <div class="card"><h3>CPU Usage</h3><div class="value">${data.cpuPercent}%</div></div>
        <div class="card"><h3>Generation</h3><div class="value">${data.game.genCount}</div></div>
        <div class="card"><h3>Sim Running</h3><div class="value">${data.game.running ? 'Yes' : 'No'}</div></div>
      `;
    }

    async function pollDockerStats() {
      const res = await fetch('/docker-stats');
      const data = await res.json();
      document.getElementById('dockerStatsLog').textContent =
        data.lines && data.lines.length ? data.lines.join('\n') : (data.error || 'No data yet');
    }

    pollHealth();
    pollDockerStats();
    setInterval(pollHealth, 5000);
    setInterval(pollDockerStats, 15000);
  </script>
</body>
</html>
