<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Game of Life v0.2</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="siteNav" aria-label="Main navigation">
    <a class="siteBrand" href="/"><span class="siteBrandMark">MG</span> Mini Games</a>
    <div class="siteNavLinks"><a href="/game-of-life/" aria-current="page">Life</a><a href="/snake/">Snake</a><a href="/elementary-ca/">Cellular</a><a href="/particle-life/">Particles</a><a href="/shitpost/">Shitpost</a><a href="/status/">Status</a></div>
  </nav>
  <main class="boardViewport">
    <canvas id="board"></canvas>
  </main>
  <div class="controls">
    <div class="controlRow actionRow">
      <button id="playPauseBtn">Play</button>
      <button id="stepBtn">Stop/Step</button>
      <button id="randomBtn">Random</button>
      <button id="clearBtn">Clear</button>
      <button id="copyPatternBtn" title="Copy the current pattern">Copy pattern</button>
      <button id="pastePatternBtn" title="Paste a copied pattern">Paste pattern</button>
    </div>
    <div class="controlRow settingsRow">
      <label class="speedControl">Speed <output id="speedValue">8 FPS</output>
        <input type="range" min="1" max="30" value="8" class="slider" id="speedRange" aria-label="Speed control">
      </label>
      <label class="colorControl">Cells <input id="cellColor" type="color" aria-label="Cell color"></label>
      <label class="colorControl">Background <input id="backgroundColor" type="color" aria-label="Background color"></label>
      <label class="sizeControl">Rows <input id="rowsInput" type="number" min="10" max="300" value="80"></label>
      <label class="sizeControl">Columns <input id="colsInput" type="number" min="10" max="400" value="160"></label>
      <button id="sizeBtn">Resize grid</button>
      <label class="ruleControl"><input id="highLifeToggle" type="checkbox"> High life rule</label>
    </div>
    <div class="controlRow statusRow">
      <output id="generationValue" class="generationValue">Generation 0 | 0.0 FPS</output>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
